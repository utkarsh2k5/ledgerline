name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ledgerline, POSTGRES_PASSWORD: ledgerline, POSTGRES_DB: ledgerline }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    strategy:
      fail-fast: false   # let both database runs finish, so one failure doesn't hide the other
      matrix:
        db: [sqlite, postgres]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: |
          if [ "${{ matrix.db }}" = "postgres" ]; then
            export TEST_DATABASE_URL=postgresql+psycopg://ledgerline:ledgerline@localhost:5432/ledgerline
          fi
          pytest
      - name: End-to-end demo produces reports
        run: python -m app.cli demo --out ../sample_output_ci

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
